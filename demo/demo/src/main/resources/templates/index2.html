<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forensic PMI calculator version 2.0</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/pmiVersion2.css}">
    
</head>

<body>
   
  <div class="cyber-workplace">
    <div id="window-alpha" class="retro-window">
        <div class="window-header">
            <span class="window-title">Forensic Invigilator</span>
            <span class="window-close">-</span>
        </div>
        <div class="window-body">
            <h2>EXECUTION OVERRIDE</h2>
            <p>Launch post mortem protocol</p>
            <button class="yes-button">Yes</button>
        </div>
    </div>

    <!-- The Main Calculator Window -->
    <div id="window-beta" class="retro-window hidden">
        <div class="window-header">
            <span class="window-title">Post Mortem Protocol</span>
            <span class="window-close">-</span>
        </div>
        
        <div class="window-body" style="display: block; text-align: left;">
            <p class="headline" style="text-align: center;">Awaiting biometric submissions...</p>
            <p class="ask" style="text-align: center; margin-bottom: 25px;">Enter the metrics below to run the post mortem analysis report</p>
            
            <form th:action="@{/calculate}" method="POST">
                
                <!-- Victim Name Row -->
                <div class="form-group">
                    <label for="victimName">Victim Name:</label>
                    <input type="text" id="victimName" name="victimName" required placeholder="e.g: Olly Doe">
                </div>

                <!-- Body Temp Toggle Checklist Row -->
                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="notSure" onchange="toggleTempInput()"> Not sure of body temperature
                    </label>
                </div>

                <!-- Hidden Body Temp Range Row -->
                <div id="rangeInput" class="form-group" style="display: none;">
                    <label for="minBodyTemp">Minimum Body Temperature:</label>
                    <input type="number" step="0.1" id="minBodyTemp" name="minBodyTemp" th:value="${minBodyTemp}">
                    <br><br>
                    <label for="maxBodyTemp">Maximum Body Temperature:</label>
                    <input type="number" step="0.1" id="maxBodyTemp" name="maxBodyTemp" th:value="${maxBodyTemp}">
                </div>

                <!-- Default Single Body Temp Row -->
                <div id="singleValueInput" class="form-group">
                    <label for="singleBodyTemp">Body Temperature:</label>
                    <input type="number" step="0.1" id="singleBodyTemp" name="singleBodyTemp" th:value="${bodyTemperature}">
                </div>

                <!-- Ambient Temp Toggle Checklist Row -->
                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="notSureRange" onchange="toggleAmbientRange()"> Not sure of the ambient Temperature
                    </label>
                </div>

                <!-- Hidden Ambient Temp Range Row -->
                <div id="ambientRange" class="form-group" style="display: none;">
                    <label for="minAmbient">Minimum Ambient Temperature:</label>
                    <input type="number" step="0.1" id="minAmbient" name="minAmbient" th:value="${minAmbient}">
                    <br><br>
                    <label for="maxAmbient">Maximum Ambient Temperature:</label>
                    <input type="number" step="0.1" id="maxAmbient" name="maxAmbient" th:value="${maxAmbient}">
                </div>

                <!-- Default Single Ambient Temp Row -->
                <div id="singleAmbientInput" class="form-group">
                    <label for="singleAmbient">Ambient Temperature:</label>
                    <input type="number" step="0.1" name="singleAmbient" id="singleAmbient" th:value="${singleAmbient}">
                </div>

                <!-- Livor Color Row -->
                <div class="form-group">
                    <label for="livorColor">Livor Color:</label>
                    <input type="text" id="livorColor" name="livorColor" required placeholder="e.g. Purple">
                </div>

                <!-- Livor Fixed Dropdown -->
                <div class="form-group">
                    <label for="isLivorFixed">Is Livor Fixed:</label>
                    <select id="isLivorFixed" name="isLivorFixed">
                        <option value="true">YES</option>
                        <option value="false">NO</option>
                    </select>
                </div>

                <!-- Rigor Stages Dropdowns -->
                <div class="form-group">
                    <label for="rigorJaw">Rigor Stage - Jaw</label>
                    <select id="rigorJaw" name="rigorJaw">
                        <option value="0">0 - Absent</option>
                        <option value="1">1 - Minimal/Settling</option>
                        <option value="2">2 - Moderate/Developing</option>
                        <option value="3">3 - Fully rigid/Peak</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="rigorArm">Rigor Stage - Arms</label>
                    <select id="rigorArm" name="rigorArm">
                        <option value="0">0 - Absent</option>
                        <option value="1">1 - Minimal/Settling</option>
                        <option value="2">2 - Moderate/Developing</option>
                        <option value="3">3 - Fully rigid/Peak</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="rigorLegs">Rigor Stage - Legs</label>
                    <select id="rigorLegs" name="rigorLegs">
                        <option value="0">0 - Absent</option>
                        <option value="1">1 - Minimal/Settling</option>
                        <option value="2">2 - Moderate/Developing</option>
                        <option value="3">3 - Fully rigid/Peak</option>
                    </select>
                </div>

                <div class="form-group" style="padding-top: 10px;">
                    <button type="submit" style="width: 100%;">Run Analysis Report</button>
                </div>
            </form>

            <!-- Server Output Processing Area -->
            <div class="result" th:if="${report}">
                <h2>Analysis Report</h2>
                <pre th:text="${report}"></pre>
            </div>
        </div>
    </div>
</div>

<script>
    // Cleaned up, bug-free Interactive View Functions
    function toggleAmbientRange() {
        var isChecked = document.getElementById("notSureRange").checked;
        var ambientRangeDiv = document.getElementById("ambientRange");
        var ambientSingleDiv = document.getElementById("singleAmbientInput");
        
        if (isChecked) {
            ambientRangeDiv.style.display = "block";
            ambientSingleDiv.style.display = "none";
        } else {
            ambientRangeDiv.style.display = "none";
            ambientSingleDiv.style.display = "block";
        }
    }

    function toggleTempInput() {
        var isChecked = document.getElementById("notSure").checked;
        var rangeDiv = document.getElementById("rangeInput");
        var singleDiv = document.getElementById("singleValueInput");
        
        if (isChecked) {
            rangeDiv.style.display = "block";
            singleDiv.style.display = "none";
        } else {
            rangeDiv.style.display = "none";
            singleDiv.style.display = "block";
        }
    }

    // Window Transition Core Animation Script
    document.querySelector('.yes-button').addEventListener('click', () => {
        const alpha = document.getElementById('window-alpha');
        const beta = document.getElementById('window-beta');
        
        alpha.classList.add('exit-minimize');
        alpha.addEventListener('animationend', () => {
            alpha.style.display = 'none';
            beta.classList.remove('hidden');
            beta.classList.add('entry-zoom');
        }, {once: true});
    });
</script>


</body>
</html>
